<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>change</title>
<link rel="stylesheet" href="kit/pf.css">
<style>
/* K1 · a project change, signalled by the timeline alone: the entering clip's brand bar swells, a soft wash of
   its colour sweeps along it, and a ring leaves the playhead. No caption, no text. */
.k1 .clip .k1wash,.k1 .clip .k1bar{position:absolute;pointer-events:none;will-change:transform,opacity;opacity:0}
.k1 .clip .k1wash{top:0;bottom:0;left:0;width:46%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--brand,#f4f2ee) 55%,transparent) 50%,transparent)}
.k1 .clip .k1bar{left:0;right:0;bottom:0;height:3px;background:var(--brand,#f4f2ee);transform-origin:50% 100%}
.k1 .head .k1ring{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:1px solid var(--ring,#f4f2ee);opacity:0;pointer-events:none;will-change:transform,opacity}
</style>
</head>
<body>
<script src="kit/pf.js"></script>
<script>
/* ──────────────────────────────────────────────────────────────────────────
   K1 · a project change, signalled by the timeline alone (replaces the retired caption exploration)

   With no caption, the cut into a new project has to read from the timeline. The reel itself keeps playing,
   so nothing happens to the film; three small things happen below it, all in the entering clip's brand colour
   (IKEA yellow, Telekom magenta, Red Bull red; the title card and the personal clip use white):
     bar        the clip's bottom bar rises (scaleY 0 → 1 → 3 → 1, 1.1 s, master curve) and settles on the
                nothing (opacity 1 → 0): at rest no clip carries a colour.
     wash       a soft band of the colour (46 % of the clip) sweeps once from the clip's left edge to its
                right (translateX −100 % → 220 %, 1.3 s, master curve; opacity 0 → .9 → 0).
     ring       a 14 px ring leaves the playhead and grows to 3× while it fades (0.9 s, expo-out).
   It plays on every clip change: a click, a key, or the reel running into the next clip. Transform and
   opacity only. Nothing is announced visually twice: a new change while one plays restarts only its own
   pieces (they are separate elements, never reset mid-gesture for another clip).
   Scripted demo: the title card runs into IKEA, a click on Telekom, the reel runs on into Red Bull by
   itself, then a click on the personal clip (white).
   Reduced motion: the bar and the ring only fade (250 ms); no sweep, no growth.
   ────────────────────────────────────────────────────────────────────────── */
Pf.define({
  K1: {
    title: 'a project change, by the timeline alone',
    does: 'brand bar swells · colour washes along the clip · ring leaves the playhead',
    why: 'The cut is felt without a word, and the film is never touched · it relies on colour, so the title card and the personal clip can only answer in white.',
    setup(ctx) {
      const { root, S, PROJECTS } = ctx;
      root.classList.add('k1');
      ctx.clips.forEach(c => c.insertAdjacentHTML('beforeend', '<i class="k1wash"></i><i class="k1bar"></i>'));
      ctx.head.insertAdjacentHTML('beforeend', '<i class="k1ring"></i>');
      const ring = ctx.head.querySelector('.k1ring');
      ctx.on('clip', i => {
        const c = ctx.clips[i], p = PROJECTS[i], wash = c.querySelector('.k1wash'), bar = c.querySelector('.k1bar');
        const rest = 0, col = p.color || '#f4f2ee';
        ring.style.setProperty('--ring', col);
        [wash, bar, ring].forEach(el => el.getAnimations().forEach(a => a.cancel()));
        if (ctx.reduced) {
          ctx.anim(bar, [{ opacity: 0 }, { opacity: .9 }, { opacity: 0 }], 250 * 3, 'soft', { fill: 'none' });
          ctx.anim(ring, [{ opacity: 0 }, { opacity: .8 }, { opacity: 0 }], 250 * 2, 'soft', { fill: 'none' });
          return;
        }
        ctx.anim(bar, [{ transform: 'scaleY(0)', opacity: 1 }, { transform: 'scaleY(3)', opacity: 1, offset: .4 }, { transform: 'scaleY(1)', opacity: rest }], 1100, 'soft', { fill: 'none' });
        ctx.anim(wash, [{ transform: 'translateX(-100%)', opacity: 0 }, { transform: 'translateX(60%)', opacity: .9, offset: .45 }, { transform: 'translateX(220%)', opacity: 0 }], 1300, 'soft', { fill: 'none' });
        ctx.anim(ring, [{ transform: 'scale(.5)', opacity: .9 }, { transform: 'scale(3)', opacity: 0 }], 900, 'arrive', { fill: 'none' });
      });
    },
    async play(ctx) {
      await ctx.wait(3200);                                          // the title card has run into IKEA (2.05 s)
      ctx.jump(3); await ctx.wait(3600);                             // Telekom, by click
      const p = ctx.PROJECTS[3]; ctx.seek(p.start + p.len - 2.2);    // 2.2 s before the end of Telekom …
      await ctx.wait(4200);                                          // … the reel runs into Red Bull by itself
      ctx.jump(5); await ctx.wait(3200);                             // the personal clip: white
    }
  }
});
</script>
</body>
</html>
