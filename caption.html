<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caption</title>
<link rel="stylesheet" href="kit/pf.css">
<style>
/* K1 · the caption as a lower third: the kit caption is replaced by three masked lines */
.k1 .cap{display:none}
.k1cap{position:absolute;left:36px;bottom:calc(var(--tl-h) + 30px);z-index:5;max-width:60%;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.kl{display:grid;overflow:hidden;align-items:end}
.kl>span{grid-area:1/1;display:block;will-change:transform,opacity}
.kl.l1{height:34px}
.kl.l1 img{display:block;width:auto;filter:drop-shadow(0 1px 8px rgba(0,0,0,.35))}
.kl.l1 .tag{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2o);padding-bottom:2px}
.kl.l2{margin-top:12px;font:400 44px/1.08 var(--serif);letter-spacing:-.015em;padding-bottom:.06em}
.kl.l3{margin-top:10px;font-size:12px;line-height:1.4;color:var(--ink-2o)}
.kl.l3 i{font-style:normal;color:var(--ink-2o);margin:0 8px}
</style>
</head>
<body>
<script src="kit/pf.js"></script>
<script>
/* ──────────────────────────────────────────────────────────────────────────
   K1 · the caption as a lower third

   The company's white logo replaces its name; under it, the project (the film being shown) and the
   role · year. The cut is the hero: inside a clip, at each cut, the second line wipes from the old
   film's name to the new one while the logo and the role stay put. On a clip change every line
   leaves and arrives on its own beat. Personal clips carry the quiet "personal" tag instead of a logo.
   Timing at 1×:
     in-clip cut  line 2 only: the old name wipes away left → right (clip-path inset, 340 ms, expo-in),
                  the new one wipes in left → right from 360 ms (800 ms, expo-out); it never shares
                  the line with the old one. Logo and role do not move.
     clip change  each line slides up out of its mask (translateY −105 %, opacity → 0, 300 ms, expo-in)
                  at 0 / 80 / 160 ms; the new lines rise from below (105 % → 0, 900 ms, expo-out) at
                  380 / 470 / 560 ms, each after its own line's exit has finished, landing around the
                  reel crossfade's midpoint (R4).
     contrast     the kit's lower-left scrim sits behind the block (AA against the brightest frames).
     a11y         the visual lines are hidden from assistive tech; one composed string per change
                  ("IKEA, the archive intro, product designer, years to confirm"), announced politely
                  only right after a user action, silent during autoplay.
   Scripted demo: plays IKEA through its first cut (the second line wipes to the next film), then
   Telekom (every line on its beat) and the collection (a cut every ≈ 4 s).
   Reduced motion: lines crossfade (250 ms), no slide or wipe; no autoplay.
   ────────────────────────────────────────────────────────────────────────── */
const FILMNAME = { archive: 'the archive, intro', 'collection-home': 'collection, home', board: 'exploration board', 'collection-recipes': 'collection, recipes',
  'recipe-page': 'recipe page', a1: 'assistant, presence', g3: 'assistant, answers', f2: 'assistant, food', p5: 'assistant, keep', g4: 'assistant, facts', f4: 'assistant, corrections', f1: 'assistant, actions' };
const CAPLOGO = { ikea: 22, telekom: 32, redbull: 26 };

Pf.define({
  K1: {
    title: 'caption as a lower third',
    does: 'white logo · the cut wipes the project line',
    why: 'The logo is recognised before it is read, and every cut names the film you are now watching · logos of different shapes make the lines uneven; needs per-logo sizing.',
    setup(ctx) {
      const { root, S, PROJECTS } = ctx;
      root.classList.add('k1');
      root.insertAdjacentHTML('beforeend', '<div class="k1cap" aria-hidden="true"><div class="kl l1"></div><div class="kl l2"></div><div class="kl l3"></div></div>');
      const L = [...root.querySelectorAll('.k1cap .kl')];
      const text = (i, seg) => {
        const p = PROJECTS[i], g = p.segs[seg || 0];
        return [
          p.kind === 'work' ? `<img src="media/logos-${p.logo}.svg" alt="" style="height:${CAPLOGO[p.logo]}px">` : '<span class="tag">personal</span>',
          Pf.esc(FILMNAME[g.film] || g.film),
          `${Pf.esc(p.role)}<i>·</i>${Pf.esc(p.yr)}`
        ];
      };
      const freeze = el => el.getAnimations().forEach(a => { try { a.commitStyles(); } catch (_) {} a.cancel(); });
      // one line: the old span leaves completely before the new one arrives (never two in the cell at once)
      function swap(k, html, outAt, inAt, how) {
        const line = L[k], old = [...line.children], nu = document.createElement('span');
        nu.innerHTML = html; line.appendChild(nu);
        if (ctx.reduced) {
          old.forEach(o => { freeze(o); ctx.anim(o, [{ opacity: 0 }], 250, 'soft').finished.then(() => o.remove()).catch(() => {}); });
          ctx.anim(nu, [{ opacity: 0 }, { opacity: 1 }], 250, 'soft', { delay: ctx.ms(150) });
          return;
        }
        old.forEach(o => {
          freeze(o);
          const kf = how === 'wipe' ? [{ clipPath: 'inset(0 0 0 100%)' }] : [{ transform: 'translateY(-105%)', opacity: 0 }];
          ctx.anim(o, kf, how === 'wipe' ? 340 : 300, 'leave', { delay: ctx.ms(outAt) }).finished.then(() => o.remove()).catch(() => {});
        });
        if (how === 'wipe') ctx.anim(nu, [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], 800, 'arrive', { delay: ctx.ms(inAt) });
        else ctx.anim(nu, [{ transform: 'translateY(105%)', opacity: 0 }, { transform: 'none', opacity: 1 }], 900, 'arrive', { delay: ctx.ms(inAt) });
      }
      const BEAT = { out: [0, 80, 160], in: [380, 470, 560] };
      let cur = -1, seg = -1;
      function update(first) {
        const i = S.cur, s = S.seg || 0;
        if (i === cur && s === seg) return;
        const t = text(i, s), p = PROJECTS[i];
        if (i !== cur) t.forEach((h, k) => swap(k, h, first ? 0 : BEAT.out[k], first ? 120 + k * 90 : BEAT.in[k], 'slide'));
        else swap(1, t[1], 0, 360, 'wipe');
        ctx.announce(`${p.kind === 'work' ? p.co : 'personal'}, ${FILMNAME[p.segs[s].film] || ''}, ${p.role}, ${p.yr}`);
        cur = i; seg = s;
      }
      update(true);
      ctx.on('frame', () => update(false));
    },
    async play(ctx) {
      await ctx.wait(7400);                // IKEA's first cut at 6.0 s: only the project line wipes
      ctx.jump(1); await ctx.wait(3800);   // Telekom: every line on its own beat
      ctx.jump(4); await ctx.wait(5600);   // the collection: a cut every ≈ 4 s
    }
  }
});
</script>
</body>
</html>
