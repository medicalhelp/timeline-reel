<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrub</title>
<link rel="stylesheet" href="kit/pf.css">
<style>
/* S1 · drag to scrub */
.s1 .tl{cursor:grab}
.s1 .tl img{-webkit-user-drag:none;user-drag:none}   /* a native image drag would cancel the pointer */
.s1.grabbing,.s1.grabbing *{cursor:grabbing !important}
.s1.grabbing .clip .strip{filter:brightness(.5) saturate(.95)}
.s1.grabbing .tip{opacity:0 !important}

/* S2 · hover to preview: a second deck of two layers over the reel (under the scrims), and a ghost line */
.pv{position:absolute;inset:0;z-index:1;opacity:0;will-change:opacity,transform;pointer-events:none}
.pv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.pv video.on{opacity:1}
.pv video.top{z-index:1}
.ghost{position:absolute;top:-6px;bottom:-6px;left:0;width:1px;margin-left:-.5px;background:var(--ink);opacity:0;pointer-events:none;will-change:transform,opacity;z-index:3}
.s2 .clip.pvh{box-shadow:inset 0 0 0 1px var(--ink-2)}   /* the clip being previewed: outlined, distinct from the playing one */
.s2 .clip.pvh .strip{filter:brightness(.5) saturate(.95)}
</style>
</head>
<body>
<script src="kit/pf.js"></script>
<script>
/* shared: frame-rate independent damp (λ per second) */
const damp = (a, b, lam, dt) => b + (a - b) * Math.exp(-lam * dt);

Pf.define({
  /* ──────────────────────────────────────────────────────────────────────────
     S1 · drag to scrub

     Grab anywhere on the timeline and drag: the playhead follows the pointer (relatively at first, so
     it never jumps on the grab) and the reel shows that moment of the film, paused on the frame like an
     editor. Let go and a short inertia carries the playhead on; the reel is already on the landing
     frame, and the playhead settles there, then the film eases back into real time.
     Timing at 1×:
       grab         a press arms; 3 px of movement starts the scrub (a plain click still jumps, as in H1).
                    The playhead keeps its place: the grab offset returns on a critically damped spring
                    (ω = 10/s, soft start), so it slides under the pointer within ≈ 0.5 s. The reel waits until that offset is under 3 px (no burst of
                    cuts on the grab), then seeks once per frame. Every film is paused while held.
       follow       playhead time damps towards the pointer, λ = 14/s (≈ lerp .2 per frame at 60 fps);
                    cuts between films crossfade in 320 ms without the settle push.
       release      pointer velocity over the last 100 ms; projected landing = pointer + v / 6
                    (exponential decay). Snap: the nearest clip start ahead of the playhead (in the
                    throw's direction, never back against it) within 40 % of a clip width; it lands
                    0.05 s inside that clip, so the reel shows the new clip's first frame at once.
       settle       the playhead's own position and velocity carry into a critically damped return
                    (ω ≥ 6/s, raised so it never overshoots or turns back); it ends within 0.5 px.
       resume       the clock eases from rate 0 to 1 over 400 ms (master curve), if it was playing.
     Scripted demo: a pointer dot grabs IKEA, drags slowly into Telekom, then flicks; the throw
     carries on and settles on a clip start, which plays.
     Reduced motion: 1:1 follow, no inertia; on release it jumps to a nearby clip start or stays;
     no autoplay.
     ────────────────────────────────────────────────────────────────────────── */
  S1: {
    title: 'drag to scrub',
    does: 'drag the playhead · inertia · settles on a clip',
    why: 'Feels like an editor and lets you sample the whole reel in one gesture · every frame of the drag is a seek, so the reel needs dense keyframes (now every 16 frames at 60 fps).',
    setup(ctx) {
      const { root, S, PROJECTS, TOTAL, EASE } = ctx, tl = ctx.$('#tl'), track = ctx.track;
      root.classList.add('s1');
      let mode = 'idle', x0 = 0, ptr = 0, off = 0, offV = 0, tSm = 0, armedSeek = false, samples = [], justDragged = false, wasPlaying = true, ramp = -1, last = performance.now();
      const W = () => track.getBoundingClientRect().width;
      const tOf = x => { const r = track.getBoundingClientRect(); return Math.max(0, Math.min(TOTAL - .05, (x - r.left) / r.width * TOTAL)); };
      const pxOf = t => t / TOTAL * W();

      ctx.listen(tl, 'pointerdown', e => {
        if (e.button > 0) return;
        e.preventDefault();                           // no native drag or selection (it fires pointercancel)
        mode = 'armed'; x0 = e.clientX; samples = [{ x: e.clientX, t: performance.now() }];
        try { tl.setPointerCapture(e.pointerId); } catch (_) {}
      });
      ctx.listen(window, 'pointermove', e => {
        if (mode === 'armed' && Math.abs(e.clientX - x0) > 3) {
          mode = 'drag'; ramp = -1; S.rate = 1; wasPlaying = S.playing; ctx.pause({ quiet: true }); root.classList.add('grabbing');
          tSm = Math.max(0, Math.min(TOTAL - .05, S.headX / W() * TOTAL)); S.t = tSm; S.off = S.offV = 0;
          ptr = tOf(e.clientX); off = ctx.reduced ? 0 : ptr - tSm; offV = 0; armedSeek = ctx.reduced;
          if (armedSeek) ctx.seek(tSm);
        }
        if (mode !== 'drag') return;
        ptr = tOf(e.clientX);
        const now = performance.now(); samples.push({ x: e.clientX, t: now });
        while (samples.length > 2 && now - samples[0].t > 100) samples.shift();
      });
      const release = () => {
        if (mode === 'armed') { mode = 'idle'; return; }
        if (mode !== 'drag') return;
        root.classList.remove('grabbing'); justDragged = true; ctx.after(50, () => (justDragged = false));
        const a = samples[0], b = samples[samples.length - 1], dtS = Math.max(.016, (b.t - a.t) / 1000);
        const vPx = (performance.now() - b.t > 120) ? 0 : (b.x - a.x) / dtS, vT = vPx / W() * TOTAL;
        const target = ptr - off;
        let land = Math.max(0, Math.min(TOTAL - .05, target + (ctx.reduced ? 0 : vT / 6)));
        // snap: the nearest clip start ahead of the playhead, in the throw's direction, within 40 % of a clip
        const dir = Math.sign(land - tSm) || Math.sign(vT) || 1;
        let best = null;
        PROJECTS.forEach((p, i) => {
          const c = p.start, ahead = (c - tSm) * dir >= -1e-3, w = Math.min(p.len, (PROJECTS[i - 1] || p).len);
          if (ahead && Math.abs(c - land) < .4 * w && (best === null || Math.abs(c - land) < Math.abs(best - land))) best = c;
        });
        if (best !== null) land = best + .05;                  // inside the clip: its first frame, not the last of the previous
        const x = S.headX, v = ctx.headV;
        ctx.seek(land, { fade: 320, settle: 900 });           // the reel goes to the landing frame now
        if (ctx.reduced) { mode = 'idle'; if (wasPlaying) ctx.play(); return; }
        // settle: the playhead carries its velocity into a critically damped return, ω raised so it never overshoots
        const o0 = x - ctx.xOf(land), toward = v * o0 < 0;
        S.off = o0; S.offV = v; S.offW = Math.min(30, Math.max(6, toward ? Math.abs(v) / Math.max(.5, Math.abs(o0)) * 1.05 : 6));
        mode = 'throw';
      };
      ctx.listen(window, 'pointerup', release);
      ctx.listen(window, 'pointercancel', release);
      ctx.listen(track, 'click', e => { if (justDragged) { e.stopPropagation(); e.preventDefault(); } }, true);

      ctx.on('tick', () => {
        const now = performance.now(), dt = Math.min(.064, (now - last) / 1000) * ctx.speed; last = now;
        if (mode === 'drag') {
          { const w = 10; let left = dt; while (left > 0) { const hh = Math.min(left, 1 / 240); offV += (-w * w * off - 2 * w * offV) * hh; off += offV * hh; left -= hh; } }   // soft start, no overshoot
          const target = ptr - off;
          tSm = ctx.reduced ? target : damp(tSm, target, 14, dt);
          if (!armedSeek && Math.abs(pxOf(off)) < 3) armedSeek = true;
          if (armedSeek) ctx.seek(tSm); else S.t = tSm;        // until then only the playhead moves
        } else if (mode === 'throw') {
          if (Math.abs(S.off) < .5) {
            S.off = S.offV = 0; mode = 'idle';
            if (wasPlaying) { S.rate = 0; ramp = 0; ctx.play(); }
          }
        }
        if (ramp >= 0) { ramp += dt; const k = EASE.soft(Math.min(1, ramp / .4)); S.rate = k; ctx.vids.forEach(v => v.playbackRate = Math.max(.0625, k) * ctx.speed); if (ramp >= .4) { ramp = -1; S.rate = 1; ctx.vids.forEach(v => v.playbackRate = ctx.speed); } }
      });
    },
    async play(ctx) {
      const p = ctx.pointer;
      await ctx.wait(1600);
      p.show(760, 420); await ctx.wait(450);
      await p.to(ctx.clipX(1) + 20, 855, 1300, 'soft');            // onto IKEA
      await ctx.wait(250);
      p.down();
      await p.to(ctx.clipX(1) + 35, 855, 260, 'arrive');           // the grab: the playhead keeps its place and slides under the pointer
      await p.to(ctx.clipX(3) - 40, 856, 2600, 'inout');           // drag slowly through IKEA into Telekom: the reel shows each moment
      await ctx.wait(420);
      await p.to(ctx.clipX(3) + 150, 856, 200, k => k);             // a flick …
      p.up(false);                                   // … and let go: inertia carries it, it settles on a clip
      await ctx.wait(900);
      await p.to(980, 420, 1500, 'soft');
      p.hide();
    }
  },

  /* ──────────────────────────────────────────────────────────────────────────
     S2 · hover to preview

     Rest on a clip for about 300 ms and its film plays in the reel from the point under the pointer;
     a ghost line marks that point and the clip is outlined, while the playhead stays where it was (the
     reel keeps playing underneath). Moving along the clip re-cues the preview; resting lets it play on
     its own clock. Leaving the timeline lets the preview dissolve back to the playing clip. A click (or
     Enter on a focused clip) commits: the reel takes over from there and the playhead glides there.
     Timing at 1×:
       ghost        a 1 px line at 60 % opacity, follows the pointer with λ = 25/s; fades in and out
                    with λ = 15/s (≈ 200 ms).
       intent       300 ms of rest (pointer moves < 1.5 px per frame) starts a preview.
       preview      a second two-layer deck over the reel (under the scrims) fades up over 420 ms (master
                    curve); the layer that becomes visible settles from scale 1.03 → 1 over 1.0 s
                    (expo-out); a cut to another film inside the preview crossfades in 320 ms (incoming on
                    top, only it fades).
       clock        while resting the preview plays on by itself; it re-anchors only after the pointer
                    has moved more than 1.5 px. Gliding fast (> 600 px/s) holds the current film; it cues
                    again below 300 px/s, so films never flicker past.
       clip mark    the previewed clip is outlined on the timeline; on leaving, the playing clip is current again.
       leave        sideways: the deck dissolves over 600 ms (master curve) from its current opacity;
                    out of the top or bottom: the preview freezes on its frame first, then dissolves.
       commit       click: the reel seeks to the hovered moment (420 ms crossfade under the deck), the
                    playhead glides there with its velocity (kit spring, ω = 7/s), then the deck dissolves.
                    Enter on a focused clip commits to the start of that clip.
     Scripted demo: a pointer dot rests on Telekom (preview), slides to Red Bull and the personal clip,
     then leaves; the reel is back on the clip that never stopped playing.
     Reduced motion: no scale settle; 250 ms crossfades; ghost follows 1:1; no autoplay.
     ────────────────────────────────────────────────────────────────────────── */
  S2: {
    title: 'hover to preview',
    does: 'rest on a clip · its film previews · leave returns',
    why: 'Sampling without commitment: the reel never loses its place · two more videos decoding at once, and nothing but the outlined clip says which part of the reel you are previewing.',
    setup(ctx) {
      const { root, S, PROJECTS, TOTAL } = ctx, tl = ctx.$('#tl'), track = ctx.track, reel = ctx.$('#reel');
      root.classList.add('s2');
      reel.insertAdjacentHTML('beforeend', '<div class="pv" aria-hidden="true"><video muted playsinline preload="auto"></video><video muted playsinline preload="auto"></video></div>');
      track.insertAdjacentHTML('beforeend', '<div class="ghost" aria-hidden="true"></div>');
      const pv = ctx.$('.pv'), dv = [...pv.querySelectorAll('video')], ghost = ctx.$('.ghost');
      let blocked = false, px = -1, py = -1, lastPx = -1, over = false, gx = 0, ga = 0, rest = 0, on = false, layer = 0, film = '', pending = null, pvClip = -1,
        anchorX = -1, speed = 0, holding = false, settleNext = false, last = performance.now();
      const rect = () => track.getBoundingClientRect();
      const tOf = x => { const r = rect(); return Math.max(0, Math.min(TOTAL - .05, (x - r.left) / r.width * TOTAL)); };
      const where = t => { const i = ctx.clipAt(t), p = PROJECTS[i], local = t - p.start, k = Pf.segAt(p, local), g = p.segs[k]; return { i, film: g.film, at: g.from + local - g.start }; };

      ctx.listen(window, 'pointermove', e => { px = e.clientX; py = e.clientY; });
      ctx.listen(document.documentElement, 'pointerleave', () => { px = py = -1; });
      ctx.listen(window, 'blur', () => { px = py = -1; });

      const settle = v => { if (settleNext && !ctx.reduced) { settleNext = false; ctx.anim(v, [{ transform: 'scale(1.03)' }, { transform: 'scale(1)' }], 1000, 'arrive'); } };
      function fadeDeck(to, d) {
        const from = +getComputedStyle(pv).opacity;
        pv.getAnimations().forEach(a => a.cancel());
        pv.style.opacity = from;
        const a = ctx.anim(pv, [{ opacity: from }, { opacity: to }], ctx.reduced ? 250 : d, 'soft');
        a.finished.then(() => { pv.style.opacity = to; a.cancel(); }).catch(() => {});
      }
      // cue the deck at reel-time t (an anchor): same film → seek; other film → load on the hidden layer, crossfade
      function cue(t) {
        const w = where(t), v = dv[layer];
        if (w.film === film) {
          if (v.readyState >= 1 && !v.seeking) { try { v.currentTime = w.at; } catch (_) {} }
          v.playbackRate = ctx.speed; v.play().catch(() => {}); settle(v);
          return;
        }
        if (pending === w.film) return;
        pending = w.film; const inc = dv[1 - layer], out = v;
        inc.getAnimations().forEach(a => a.cancel()); inc.classList.remove('top');
        inc.src = Pf.film(w.film); try { inc.currentTime = w.at; } catch (_) {}
        inc.playbackRate = ctx.speed; inc.play().catch(() => {});
        const go = () => {
          if (pending !== w.film) return; pending = null;
          film = w.film; layer = 1 - layer; out.classList.remove('top'); inc.classList.add('on', 'top');
          ctx.anim(inc, [{ opacity: 0 }, { opacity: 1 }], ctx.reduced ? 250 : 320, 'soft'); settle(inc);
          ctx.after(ctx.reduced ? 260 : 340, () => { if (dv[layer] !== out) { out.getAnimations().forEach(a => a.cancel()); out.classList.remove('on'); out.pause(); } });
        };
        if (inc.readyState >= 2 && !inc.seeking) go(); else { const f = () => { inc.removeEventListener('seeked', f); inc.removeEventListener('loadeddata', f); go(); }; inc.addEventListener('seeked', f); inc.addEventListener('loadeddata', f); ctx.after(900, go); }
      }
      function start(t) {
        on = true; holding = false; settleNext = true; anchorX = px; cue(t); fadeDeck(1, 420);
        pvClip = ctx.clipAt(t); mark(pvClip);
      }
      function end(freeze) {
        on = false; if (freeze) dv.forEach(v => v.pause());
        fadeDeck(0, 600); mark(-1);
        ctx.after(700, () => { if (!on) dv.forEach(v => v.pause()); });
      }
      const mark = i => ctx.clips.forEach((c, k) => c.classList.toggle('pvh', k === i));
      // commit: the reel takes over from the hovered moment (pointer), or from the clip's start (keyboard)
      ctx.listen(track, 'click', e => {
        e.stopPropagation(); e.preventDefault(); ctx.user();
        const c = e.target.closest('.clip');
        const t = e.detail === 0 && c ? PROJECTS[+c.dataset.i].start : tOf(e.clientX);
        ctx.seek(t, { fade: 420, settle: 1000, glide: true });
        if (!S.playing && !ctx.reduced) ctx.play();
        ctx.after(480, () => { if (on) { on = false; fadeDeck(0, 600); } mark(-1); dv.forEach(v => v.pause()); });
        blocked = true;                               // no new preview until the pointer moves again
      }, true);

      ctx.on('tick', () => {
        const now = performance.now(), dt = Math.min(.064, (now - last) / 1000) * ctx.speed; last = now;
        const r = rect(), tr = tl.getBoundingClientRect();
        const inX = px >= r.left - 2 && px <= r.right + 2, inY = py >= tr.top && py <= tr.bottom;
        const wasOver = over; over = inX && inY;
        const dx = lastPx < 0 ? 0 : Math.abs(px - lastPx), moved = dx > 1.5; lastPx = px;
        speed = damp(speed, dt > 0 ? dx / (dt / ctx.speed) : 0, 20, dt);                // px per real second
        if (over) {
          const x = Math.max(0, Math.min(r.width, px - r.left));
          gx = ga < .02 || ctx.reduced ? x : damp(gx, x, 25, dt);
          if (moved) { rest = 0; blocked = false; } else rest += dt;
          if (!on && !blocked && rest >= .3) start(tOf(px));
          else if (on) {
            // the preview runs on its own clock; re-anchor only after real movement, and not while gliding fast
            if (holding) { if (speed < 300) holding = false; } else if (speed > 600) holding = true;
            if (!holding && Math.abs(px - anchorX) > 1.5 && (speed < 300 || !moved)) { anchorX = px; cue(tOf(px)); }
            const ci = ctx.clipAt(tOf(px)); if (ci !== pvClip) { pvClip = ci; mark(ci); }
          }
        } else { rest = 0; if (on) end(wasOver && inX && !inY); }      // left through the top or bottom: freeze first
        ga = damp(ga, over ? 1 : 0, ctx.reduced ? 40 : 15, dt);
        ghost.style.transform = `translateX(${gx.toFixed(2)}px)`; ghost.style.opacity = (ga * .6).toFixed(3);
      });
    },
    async play(ctx) {
      const p = ctx.pointer;
      await ctx.wait(1600);
      p.show(780, 400); await ctx.wait(450);
      await p.to(ctx.clipX(3), 856, 1400, 'soft');            // rest on Telekom: after 300 ms its film previews
      await ctx.wait(2200);
      await p.to(ctx.clipX(4), 853, 1200, 'soft', -10);       // slide to Red Bull: the preview follows
      await ctx.wait(2000);
      await p.to(ctx.clipX(5), 856, 1100, 'soft', -10);      // the personal clip
      await ctx.wait(2000);
      await p.to(1000, 380, 1500, 'soft');           // leave: back to the clip that kept playing
      p.hide();
    }
  }
});
</script>
</body>
</html>
